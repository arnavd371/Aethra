<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roadmap</title>
  <meta name="description" content="Where Aethra is going next." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="topbar" aria-hidden="true"></div>

<!-- Masthead -->
<div class="masthead">
  <header class="reveal">
    <span class="brand">Aethra</span>
    <nav>
      <a href="index.html">Home</a>
      <a href="events.html">Events</a>
      <a href="research.html">Research</a>
      <a href="roadmap.html">Roadmap</a>
      <a href="index.html#join">Join Us</a>
    </nav>
  </header>

  <h1 class="section-head reveal" style="margin-top:32px">Roadmap</h1>

  <p class="hero-p reveal">
    Where Aethra is going.
  </p>
</div>

<div class="feed">

<ul class="items">
  <li class="item reveal">
    <span class="item-dot"></span>
    <div class="item-body item-card">
      <div class="item-head">
        <span class="item-title">Phase 1 — Hackathons</span>
        <span class="item-meta">Complete</span>
      </div>
      <p class="item-desc">Build the community through high-quality hackathons. Prove that serious, mission-driven events attract serious people. Establish the network.</p>
    </div>
  </li>
</ul>

<footer class="reveal">
  <p>Aethra. Where fields converge.</p>
</footer>

</div><!-- /feed -->

<script>
const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
}, { threshold: 0.08 });
document.querySelectorAll('.reveal').forEach(el => io.observe(el));
</script>
</body>
</html>
